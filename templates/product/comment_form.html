{% extends 'base.html' %}
{% block content %}
<h2>update comment</h2>
<section class="mb-5">
    <div class="card bg-light">
        <div class="card-body">
            <form method="post" class="mb-4" action="{% url 'comment_update' comment.id %}">
                {% csrf_token %}
                {{ form.non_field_errors }}
                {{ form.content.errors }}
                <label for="content" class="form-label">내용</label>
                <textarea id="content" name="content" class="form-control" rows="3">{{ form.content.value|default_if_none:"" }}</textarea>
                <button type="submit" class="btn btn-primary">submit</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
